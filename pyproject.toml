[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor-pa"
version = "0.24.0"
description = "Extractor maestro de planes de acción y seguimiento de política pública desde Excel (SDP/SDIS)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Equipo PP" }]
keywords = ["politica-publica", "plan-de-accion", "seguimiento", "excel", "openpyxl", "sdp", "sdis"]
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Soporte de seguimiento en formato .xlsb
xlsb = ["pyxlsb>=1.0"]
# Adaptadores de salida tabular (DataFrame)
pandas = ["pandas>=2.0"]
# El extra `fuzzy` (rapidfuzz) se retiró en la 0.23.0: la normalización de
# sectores/entidades es determinista, por el listado oficial (ver CHANGELOG).
dev = ["pytest>=7.0"]

[project.scripts]
extractor-pa = "extractor_pa.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["extractor_pa*"]

# El listado oficial de sectores y entidades (`data/entidades_distrito.json`) viaja
# DENTRO del paquete: sin esto la librería funciona en el árbol de fuentes pero al
# instalarla el archivo no llega e `import extractor_pa` falla con un mensaje que lo
# dice. `data/entidad_sector.json` es un derivado que se conserva mientras los `.spec`
# de PyInstaller de sispp lo nombren por ruta (`python scripts/gen_entidad_sector.py`).
[tool.setuptools.package-data]
extractor_pa = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: regresión exhaustiva sobre todas las políticas (correr con -m slow)",
]
filterwarnings = [
    # openpyxl usa datetime.utcnow() al guardar; no es nuestro y Python 3.12+ lo avisa.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:openpyxl",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Solo errores reales: sintaxis (E9) y pyflakes (nombres sin usar o sin definir).
select = ["E9", "F"]
