name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (errores y nombres sin usar)
        run: |
          python -m pip install --upgrade pip ruff
          ruff check extractor_pa scripts tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (con extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[xlsb,pandas,dev]"
      - name: Verificar CLI
        run: extractor-pa --version
      - name: Pruebas
        run: pytest -q
