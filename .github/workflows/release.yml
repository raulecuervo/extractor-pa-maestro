name: Release

# Al empujar un tag vX.Y.Z se construyen el wheel y el sdist y se adjuntan a un
# Release de GitHub. Los aplicativos pueden instalar desde ese wheel en vez de
# compilar desde git (útil en contenedores sin git).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El tag coincide con la versión del paquete
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('extractor_pa/__init__.py', encoding='utf-8').read()).group(1))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "pyproject dice v$VERSION y el tag es $GITHUB_REF_NAME"; exit 1; }
          test "$VERSION" = "$INIT" || { echo "pyproject dice $VERSION y __init__ dice $INIT"; exit 1; }
      - name: Pruebas
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[xlsb,pandas,dev]"
          pytest -q
      - name: Construir wheel y sdist
        run: python -m build
      - name: Crear el Release con los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Ver CHANGELOG.md."
